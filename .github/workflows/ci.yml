name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --all-groups --python "${{ matrix.python }}"
      - name: Test
        run: uv run --python "${{ matrix.python }}" pytest
      - name: Lint
        run: uv run --python "${{ matrix.python }}" ruff check .
      - name: Format
        run: uv run --python "${{ matrix.python }}" ruff format --check .
      - name: Type check
        run: uv run --python "${{ matrix.python }}" mypy
      - name: Build
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv build
